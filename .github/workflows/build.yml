# Builds and tests on every push (Windows, Android); a pushed tag v* also publishes a GitHub release with the Windows
# setup wizard, the portable zip and the Android APK. Windows code signing (SignPath Foundation) runs once the
# repository variable SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN are set; until then the files go out
# unsigned. The APK is signed with the release key from the secrets ANDROID_KEYSTORE_* (README, Releasing).
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # create the release

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: zip mingw-w64-x86_64-qt6-base mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-gcc mingw-w64-x86_64-nsis
      - name: Tag matches the version   # v0.2.1, or v0.2.1-beta: a pre-release of 0.2.1
        if: startsWith(github.ref, 'refs/tags/v')
        run: grep -q "^project(TechyNotes VERSION $(echo ${GITHUB_REF_NAME#v} | cut -d- -f1) " CMakeLists.txt || { echo "tag $GITHUB_REF_NAME, but CMakeLists.txt says otherwise"; exit 1; }
      - run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build
      - run: ./build/selftest.exe && timeout 120 ./build/inputtest.exe -platform offscreen
      - name: Deploy
        run: |
          D=Techy-Notes
          mkdir $D $D/licenses && cp build/techy-notes.exe build/*.dll README.md LICENSE $D && cp -r build/plugins $D/   # the core + math DLLs, the plug-ins
          windeployqt6 --release --no-translations --no-system-d3d-compiler --no-system-dxc-compiler --no-opengl-sw \
            --skip-plugin-types tls,networkinformation,generic $D/techy-notes.exe
          # MSYS2's Qt links MinGW DLLs (ICU, harfbuzz, ...) windeployqt doesn't copy; twice for their own deps
          for i in 1 2; do
            find $D -name '*.dll' -o -name '*.exe' | xargs ldd | grep -i mingw64 | awk '{print $3}' | sort -u | tee -a deps.txt | xargs -r cp -n -t $D
          done
          # license texts of every bundled library (Qt and glib are LGPL: notices must ship with the DLLs)
          for p in mingw-w64-x86_64-qt6-base $(sort -u deps.txt | xargs pacman -Qqo | sort -u); do
            cp -r /mingw64/share/licenses/${p#mingw-w64-x86_64-} $D/licenses/ 2>/dev/null || true
          done
          cp /mingw64/share/icu/*/LICENSE $D/licenses/icu.txt
          cp data/LICENSE-HWRT.txt $D/licenses/   # ODbL notice for the built-in symbol templates

      # Signing, step 1: the program itself (it goes into both downloads)
      - if: vars.SIGNPATH_ORGANIZATION_ID != ''
        id: unsigned-exe
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: Techy-Notes/techy-notes.exe
      - if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: Techy-Notes
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-exe
      - if: vars.SIGNPATH_ORGANIZATION_ID != ''
        run: cp signed-exe/techy-notes.exe Techy-Notes/

      - name: Package
        run: |
          V=${GITHUB_REF_NAME//\//-}
          zip -rq Techy-Notes-$V-win64.zip Techy-Notes
          sh tools/uninstall-list.sh Techy-Notes > uninstall-list.nsh   # what the uninstaller removes, exactly
          makensis -V2 "-DFILES=$(cygpath -w "$PWD/Techy-Notes")" "-DLIST=$(cygpath -w "$PWD/uninstall-list.nsh")" \
            "-DOUT=$(cygpath -w "$PWD")\\Techy-Notes-$V-setup.exe" "$(cygpath -w "$PWD/build/installer.nsi")"

      # Signing, step 2: the setup wizard
      - if: vars.SIGNPATH_ORGANIZATION_ID != ''
        id: unsigned-setup
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: Techy-Notes-*-setup.exe
      - if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: Techy-Notes
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-setup
      - if: vars.SIGNPATH_ORGANIZATION_ID != ''
        run: cp signed-setup/Techy-Notes-*-setup.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: Techy-Notes-win64
          path: |
            Techy-Notes-*-win64.zip
            Techy-Notes-*-setup.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK and NDK (the versions Qt 6.10 is built with)
        run: |
          sudo apt-get install -y ninja-build
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" > /dev/null
      - uses: jurplel/install-qt-action@v4   # official Qt binaries (LGPL), with the desktop Qt its tools need
        with:
          version: 6.10.1
          host: all_os
          target: android
          arch: android_arm64_v8a
          cache: true
      # The release key (README, Releasing): updates install only over an APK signed with the same key. Without it,
      # builds of main and pre-release tags (v0.2.1-beta) get a throwaway key (test builds); a release refuses.
      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > ks.p12 && P=$KS_PASS
          elif [[ $GITHUB_REF == refs/tags/v* && $GITHUB_REF_NAME != *-* ]]; then
            echo "::error::set the secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD first (README, Releasing)"; exit 1
          else
            P=throwaway
            keytool -genkeypair -keystore ks.p12 -storetype PKCS12 -alias techy-notes -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass $P -keypass $P -dname CN=test
          fi
          { echo "QT_ANDROID_KEYSTORE_PATH=$PWD/ks.p12"; echo QT_ANDROID_KEYSTORE_ALIAS=techy-notes
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=$P"; echo "QT_ANDROID_KEYSTORE_KEY_PASS=$P"; } >> "$GITHUB_ENV"
      - name: Build the APK
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018" -DQT_ANDROID_SIGN_APK=ON
          # Qt is LGPL: its license text ships inside the APK (next to the GPL and the HWRT notice, see CMakeLists.txt)
          curl -sfL --retry 3 -o build/android/assets/licenses/LGPL-3.0.txt https://www.gnu.org/licenses/lgpl-3.0.txt
          cmake --build build --target apk
          V=${GITHUB_REF_NAME//\//-}
          cp "$(find build -name '*-signed.apk' | head -1)" Techy-Notes-$V-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Techy-Notes-android
          path: Techy-Notes-*-android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Techy-Notes-*   # not the unsigned-* files of the signing steps
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Techy-Notes-*-setup.exe
            Techy-Notes-*-win64.zip
            Techy-Notes-*-android.apk
          generate_release_notes: true
          body: ${{ contains(github.ref_name, '-') && secrets.ANDROID_KEYSTORE_BASE64 == '' && 'Pre-release for testing. The Android APK is signed with a throwaway key, so a later version will not install over it. Uninstall it first, which deletes its notebooks (Sheet > Export PDF keeps copies).' || '' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
